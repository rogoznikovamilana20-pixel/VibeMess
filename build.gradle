// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url = 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20"
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:1.9.20-1.0.14"
    }
}
allprojects {
    repositories {
        google()
    }
    afterEvaluate { project ->
        if (gradle.ext.has('RELEASE_STORE_PASSWORD')) {
            project.ext.RELEASE_STORE_PASSWORD = gradle.ext.RELEASE_STORE_PASSWORD
        }
        if (gradle.ext.has('RELEASE_KEY_ALIAS')) {
            project.ext.RELEASE_KEY_ALIAS = gradle.ext.RELEASE_KEY_ALIAS
        }
        if (gradle.ext.has('RELEASE_KEY_PASSWORD')) {
            project.ext.RELEASE_KEY_PASSWORD = gradle.ext.RELEASE_KEY_PASSWORD
        }
        if (gradle.ext.has('VIBE_KEYSTORE_PATH')) {
            project.ext.VIBE_KEYSTORE_PATH = gradle.ext.VIBE_KEYSTORE_PATH
        }
    }
}
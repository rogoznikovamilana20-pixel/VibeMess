name: Server CI

on:
  push:
    branches: [main, develop]
    paths: ["vibe-server/**"]

jobs:
  build:
    name: Build & Test Rust Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: vibe-server
          path: vibe-server/target/release/vibe-server

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  test:
    name: Tests & Kotlin lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare local.properties
        run: |
          cat > local.properties << 'PROPERTIES'
          RELEASE_STORE_PASSWORD=vibe2026
          RELEASE_KEY_ALIAS=vibe-release
          RELEASE_KEY_PASSWORD=vibe2026
          VIBE_KEYSTORE_PATH=vibe-ui/config/vibe-release.jks
          PROPERTIES
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          fi
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          fi
          if [ -n "${{ secrets.AI_API_KEY }}" ]; then
            echo "AI_API_KEY=${{ secrets.AI_API_KEY }}" >> local.properties
          fi

      - name: Run all tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compile Kotlin modules (fast check)
        run: |
          ./gradlew :vibe-common:compileDebugKotlin \
                    :vibe-bridge:compileDebugKotlin \
                    :vibe-ui:compileDebugKotlin \
                    --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Prepare local.properties
        run: |
          cat > local.properties << 'PROPERTIES'
          RELEASE_STORE_PASSWORD=vibe2026
          RELEASE_KEY_ALIAS=vibe-release
          RELEASE_KEY_PASSWORD=vibe2026
          VIBE_KEYSTORE_PATH=vibe-ui/config/vibe-release.jks
          PROPERTIES
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          fi
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          fi
          if [ -n "${{ secrets.AI_API_KEY }}" ]; then
            echo "AI_API_KEY=${{ secrets.AI_API_KEY }}" >> local.properties
          fi
      - name: Run lint
        run: ./gradlew :vibe-ui:lintDebug --stacktrace || true
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: "**/build/reports/lint-results*"

  apk:
    name: Build APK (full)
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Prepare local.properties
        run: |
          cat > local.properties << 'PROPERTIES'
          RELEASE_STORE_PASSWORD=vibe2026
          RELEASE_KEY_ALIAS=vibe-release
          RELEASE_KEY_PASSWORD=vibe2026
          VIBE_KEYSTORE_PATH=vibe-ui/config/vibe-release.jks
          PROPERTIES
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          fi
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          fi
          if [ -n "${{ secrets.AI_API_KEY }}" ]; then
            echo "AI_API_KEY=${{ secrets.AI_API_KEY }}" >> local.properties
          fi
      - name: Build debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: "**/build/outputs/apk/debug/*.apk"

// Load signing credentials from local.properties
def localProps = new Properties()
def localFile = new File(rootDir, 'local.properties')
if (localFile.exists()) {
    localProps.load(localFile.newDataInputStream())
    ['RELEASE_STORE_PASSWORD', 'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD', 'VIBE_KEYSTORE_PATH'].each { key ->
        if (localProps.containsKey(key)) {
            gradle.ext[key] = localProps.getProperty(key)
        }
    }
}


# Vibe TURN/STUN server configuration
# Copy this file and adjust for your environment

# Listening ports
listening-port=3478
tls-listening-port=5349

# Relay ports (UDP)
min-port=49152
max-port=65535

# Fingerprint and DTLS
fingerprint
dtls

# Realm (change to your domain)
realm=vibe.app

# Authentication credentials (change the password!)
user=vibe:change-this-password

# Allow all users (we authenticate via credentials)
no-auth

# Do not allow anonymous access
# (user credentials above are used)

# Logging
verbose
log-file=/var/log/coturn.log

# STUN only by default (TURN is enabled when client provides credentials)
stun-only

# If you want TURN relay, uncomment:
# no-stun
# relay-ip=YOUR_SERVER_IP
# external-ip=YOUR_PUBLIC_IP

# TLS support (optional - provide cert files)
# cert=/etc/coturn/certs/cert.pem
# pkey=/etc/coturn/certs/privkey.pem

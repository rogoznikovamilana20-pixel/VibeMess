# Vibe TURN/STUN server configuration
# Copy this file and adjust for your environment

# Listening ports
listening-port=3478
tls-listening-port=5349

# Relay ports (UDP)
min-port=49152
max-port=65535

# Fingerprint and DTLS
fingerprint
dtls

# Realm (change to your domain)
realm=vibe.app

# Short-lived credentials via shared secret.
# static-auth-secret MUST match TURN_SECRET in vibe-server/.env
# (vibe-server signs credentials with HMAC-SHA1: username=<expiry>, password=base64(hmac))
use-auth-secret
static-auth-secret=CHANGE_ME_share_with_vibe_server_TURN_SECRET

# Verify username as a unix expiry timestamp
# (libwebrtc clients present credentials without Origin header)

# Relay behaviour: keep STUN (peer discovery) AND TURN relay enabled.
# TURN relay is used when clients present valid auth-secret credentials.
# Uncomment and set on your server:
# external-ip=YOUR_PUBLIC_IP
# relay-ip=YOUR_LOCAL_IP

# Logging
verbose
log-file=/var/log/coturn.log
